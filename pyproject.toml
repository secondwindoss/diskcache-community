[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "diskcache-community"
dynamic = ["version"]
description = "Disk Cache -- Disk and file backed persistent cache."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Grant Jenks" }]
maintainers = [{ name = "diskcache-community contributors" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/secondwindoss/diskcache-community"
Documentation = "https://diskcache-community.readthedocs.io/"
Source = "https://github.com/secondwindoss/diskcache-community"
Tracker = "https://github.com/secondwindoss/diskcache-community/issues"
Upstream = "https://github.com/grantjenks/python-diskcache"

[tool.setuptools]
packages = ["diskcache_community"]

[tool.setuptools.dynamic]
version = { attr = "diskcache_community.__version__" }
