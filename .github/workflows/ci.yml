name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_COLOR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:

  lint:
    name: lint (${{ matrix.check }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [bluecheck, doc8, docs, flake8, isortcheck, mypy, pylint]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install tox
        run: pip install tox
      - name: Run ${{ matrix.check }}
        run: tox -e ${{ matrix.check }}

  test:
    name: test (${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
        include:
          - os: macos-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install diskcache and test dependencies
        run: pip install -e . "django==5.2.*" numpy pydantic pytest pytest-cov pytest-django pytest-xdist
      - name: Run tests
        run: pytest

  django:
    name: django ${{ matrix.django }} (${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - django: '4.2'
            python: '3.12'
          - django: '6.0'
            python: '3.14'
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install diskcache and test dependencies
        run: pip install -e . "django==${{ matrix.django }}.*" pytest pytest-cov pytest-django pytest-xdist
      - name: Run tests
        run: pytest

  sqlite-dqs:
    name: sqlite without double-quoted strings
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build SQLite 3.49.1 with SQLITE_DQS=0 and preload it
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfLO https://sqlite.org/2025/sqlite-autoconf-3490100.tar.gz
          echo "106642d8ccb36c5f7323b64e4152e9b719f7c0215acf5bfeac3d5e7f97b59254  sqlite-autoconf-3490100.tar.gz" | sha256sum -c
          tar xzf sqlite-autoconf-3490100.tar.gz
          cd sqlite-autoconf-3490100
          ./configure --disable-static CPPFLAGS="-DSQLITE_DQS=0" > configure.log
          make -j"$(nproc)" > make.log
          lib="$(find "$PWD" -maxdepth 1 -name 'libsqlite3.so*' -type f | head -1)"
          test -n "$lib"
          echo "LD_PRELOAD=$lib" >> "$GITHUB_ENV"
      - name: Check that Python now uses a SQLite that rejects double-quoted string literals
        run: |
          python - <<'PY'
          import sqlite3
          import sys

          print('sqlite', sqlite3.sqlite_version, 'python', sys.version.split()[0])
          if sqlite3.sqlite_version != '3.49.1':
              sys.exit('the preloaded SQLite is not in use')
          try:
              sqlite3.connect(':memory:').execute('SELECT "not a column"')
          except sqlite3.OperationalError as error:
              print('double-quoted strings are rejected:', error)
          else:
              sys.exit('this SQLite accepts double-quoted strings, so the job proves nothing')
          PY
      - name: Install diskcache and test dependencies
        run: pip install -e . "django==5.2.*" pytest pytest-cov pytest-django pytest-xdist
      - name: Run tests
        run: pytest

  no-django:
    name: import without Django
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install diskcache-community
        run: pip install .
      - name: Import diskcache_community without Django installed
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('django') is not None)"
          python -W error -c "import diskcache_community as dc; assert 'DjangoCache' not in dc.__all__, dc.__all__; print('diskcache_community', dc.__version__, 'imported without Django')"

  coexist:
    name: next to upstream diskcache 5.6.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SETTINGS_MODULE: tests.settings
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install diskcache-community and upstream diskcache 5.6.3 together
        run: pip install . "diskcache==5.6.3" "django==5.2.*" pytest pytest-cov pytest-django pytest-xdist
      - name: Create a separate environment with only diskcache 5.6.3
        run: |
          python -m venv "$RUNNER_TEMP/venv-563"
          "$RUNNER_TEMP/venv-563/bin/pip" install "diskcache==5.6.3"
      - name: Run the coexistence and golden tests in both directions
        env:
          DISKCACHE_GOLDEN_563_PYTHON: ${{ runner.temp }}/venv-563/bin/python
        run: pytest --no-cov -p no:cacheprovider tests/test_init.py tests/test_golden.py
      - name: Uninstall either distribution and check the other still imports
        working-directory: ${{ runner.temp }}
        env:
          PYTHONPATH: ''
        run: |
          pip check
          pip uninstall -y diskcache
          python -c "import diskcache_community as dc; print('diskcache_community', dc.__version__)"
          pip install "diskcache==5.6.3"
          pip uninstall -y diskcache-community
          python -c "import diskcache; assert diskcache.__version__ == '5.6.3'; print('diskcache', diskcache.__version__)"
          python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('diskcache_community') is not None)"

  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, test, django, sqlite-dqs, no-django, coexist]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo '${{ toJSON(needs) }}'
          exit 1
      - run: echo "All jobs succeeded."
